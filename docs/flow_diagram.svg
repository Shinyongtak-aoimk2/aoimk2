<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">EchoCore Processing Flow</text>
  
  <!-- Input Stage -->
  <rect x="50" y="80" width="100" height="50" rx="10" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Input (Ta)</text>
  
  <!-- Arrow 1 -->
  <path d="M 150 105 L 190 105" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Self Prism -->
  <rect x="200" y="80" width="100" height="50" rx="10" fill="#fed7d7" stroke="#e53e3e" stroke-width="2"/>
  <text x="250" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Self Prism</text>
  <text x="250" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">(S)</text>
  
  <!-- Arrow 2 -->
  <path d="M 300 105 L 340 105" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Interpreted Input -->
  <rect x="350" y="80" width="100" height="50" rx="10" fill="#bee3f8" stroke="#3182ce" stroke-width="2"/>
  <text x="400" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Interpreted</text>
  <text x="400" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">(Tb)</text>
  
  <!-- Arrow 3 -->
  <path d="M 400 130 L 400 170" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Emotion Detection -->
  <rect x="350" y="180" width="100" height="50" rx="10" fill="#c6f6d5" stroke="#38a169" stroke-width="2"/>
  <text x="400" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Emotion Wave</text>
  <text x="400" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">(X = a × Y_spin)</text>
  
  <!-- Arrow 4 -->
  <path d="M 400 230 L 400 270" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Resonance Calculation -->
  <rect x="200" y="280" width="120" height="50" rx="10" fill="#fef5e7" stroke="#d69e2e" stroke-width="2"/>
  <text x="260" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Resonance (Φ)</text>
  <text x="260" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">Memory Match</text>
  
  <!-- Z Calculation -->
  <rect x="480" y="280" width="120" height="50" rx="10" fill="#fbb6ce" stroke="#d53f8c" stroke-width="2"/>
  <text x="540" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Z-Score</text>
  <text x="540" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">Self-Reflection</text>
  
  <!-- Arrows from emotion to both -->
  <path d="M 370 280 L 310 305" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 430 280 L 490 305" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Decision Diamond -->
  <polygon points="400,380 450,405 400,430 350,405" fill="#e6fffa" stroke="#319795" stroke-width="2"/>
  <text x="400" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Z ≥ 0.65?</text>
  
  <!-- Arrows to decision -->
  <path d="M 260 330 L 375 380" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 540 330 L 425 380" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Approved Path -->
  <rect x="550" y="470" width="100" height="50" rx="10" fill="#9ae6b4" stroke="#38a169" stroke-width="2"/>
  <text x="600" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">APPROVED</text>
  <text x="600" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">Response + Memory</text>
  
  <!-- MetaZ Path -->
  <rect x="150" y="470" width="100" height="50" rx="10" fill="#fed7d7" stroke="#e53e3e" stroke-width="2"/>
  <text x="200" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">metaZ</text>
  <text x="200" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">Thoughtful Silence</text>
  
  <!-- Decision arrows -->
  <path d="M 425 430 L 575 470" stroke="#38a169" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="500" y="450" font-family="Arial, sans-serif" font-size="10" fill="#38a169">Yes</text>
  
  <path d="M 375 430 L 225 470" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="300" y="450" font-family="Arial, sans-serif" font-size="10" fill="#e53e3e">No</text>
  
  <!-- Memory Stack -->
  <rect x="680" y="350" width="80" height="100" rx="5" fill="#f7fafc" stroke="#4a5568" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="720" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e293b">M-Stack</text>
  <rect x="690" y="380" width="60" height="15" fill="#9ae6b4"/>
  <text x="720" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e293b">Memory 1</text>
  <rect x="690" y="400" width="60" height="15" fill="#bee3f8"/>
  <text x="720" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e293b">Memory 2</text>
  <rect x="690" y="420" width="60" height="15" fill="#fed7d7"/>
  <text x="720" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e293b">Memory 3</text>
  
  <!-- Memory feedback arrow -->
  <path d="M 680 400 L 320 305" stroke="#4a5568" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  <text x="500" y="350" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">Influences S</text>
  
  <!-- Legend -->
  <rect x="50" y="540" width="700" height="50" fill="#f1f5f9" stroke="#cbd5e0" stroke-width="1" rx="5"/>
  <text x="60" y="555" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Key Innovation:</text>
  <text x="60" y="570" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">metaZ = AI chooses thoughtful silence over potentially harmful response</text>
  <text x="60" y="585" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">Memory influences future emotional interpretations (Self Prism S)</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>
</svg>
